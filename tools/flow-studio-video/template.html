<!doctype html>
<html><head><meta charset="utf-8"><title>Flow Studio 30s</title>
<style>
/*FONTS*/
:root{--bg:#0a0f1f;--ink:#eaf0ff;--muted:#8b95bd;--ops:#19b8d8;--ops-soft:#0e5a6b;--ai:#9a7bff;--risk:#f2a516;--line:#2a3560;--dot:#151d38}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;color:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;background:radial-gradient(circle at 50% 45%,#10183a 0%,#0a0f1f 70%)}
#stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 2px,transparent 2px);background-size:40px 40px;opacity:.9}
svg{position:absolute;inset:0}
.t{position:absolute;white-space:nowrap}
#title{left:90px;top:56px}
#title h1{font-size:60px;font-weight:700;letter-spacing:-.01em}
#title p{font-size:28px;font-weight:500;color:var(--muted);margin-top:6px}
#cap{left:0;width:1920px;text-align:center;top:960px;font-size:42px;font-weight:600;white-space:normal;padding:0 160px;line-height:1.25}
#end{left:0;width:1920px;top:360px;text-align:center}
#end .a{font-size:84px;font-weight:700;letter-spacing:-.015em}
#end .b{font-size:96px;font-weight:700;color:var(--ops);margin-top:26px}
#end .c{font-size:34px;font-weight:500;color:var(--muted);margin-top:30px}
#log{left:0;width:1920px;top:830px;text-align:center}
.pill{display:inline-block;margin:0 14px;padding:16px 30px;border-radius:999px;border:2px solid var(--ops);font-size:32px;font-weight:600;background:#0c2530}
</style></head><body>
<div id="stage">
<svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6aa0"/></marker>
<g id="sym"></g></defs>
<g id="edges"></g><g id="labels"></g><g id="nodes"></g><g id="bundles"></g></svg>
<div class="t" id="title"><h1>AI Lead Qualifier</h1><p>Demo project, synthetic data</p></div>
<div class="t" id="cap"></div>
<div class="t" id="log"><span class="pill">Run logged</span><span class="pill">Operations</span><span class="pill">Credits</span><span class="pill">Run time</span></div>
<div class="t" id="end"><div class="a">Want this for your business?</div><div class="b">Message me.</div><div class="c">Daniel Schley · AI Ops Expert</div></div>
</div>
<script>
const G={
webhook:'<circle cx="6.5" cy="17" r="2.6"/><circle cx="17.5" cy="17" r="2.6"/><circle cx="12" cy="6.5" r="2.6"/><path d="M12 9.2l-4 5.6M9.1 17h5.8M12 9.2l4 5.6"/>',
hubspot:'<circle cx="11" cy="13" r="3.2"/><circle cx="18.5" cy="6" r="1.8"/><path d="M13.3 10.7L17.2 7.3M11 9.8V5.6M8.6 15.2L5.8 17.9"/><circle cx="11" cy="4.3" r="1.3"/><circle cx="4.8" cy="18.7" r="1.3"/>',
slack:'<path d="M9.5 4L8 20M16 4l-1.5 16M4 9.5h16M3.5 15h16"/>',
claude:'<path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/>',
router:'<circle cx="5.5" cy="12" r="2"/><path d="M7.5 12h4M11.5 12L17 6.5M11.5 12L17 17.5M11.5 12h6"/><circle cx="18.7" cy="6" r="1.3"/><circle cx="19" cy="12" r="1.3"/><circle cx="18.7" cy="18" r="1.3"/>',
store:'<ellipse cx="12" cy="6.5" rx="7" ry="2.8"/><path d="M5 6.5v11c0 1.6 3.1 2.8 7 2.8s7-1.2 7-2.8v-11M5 12c0 1.6 3.1 2.8 7 2.8s7-1.2 7-2.8"/>',
json:'<path d="M9 4.5C7 4.5 7 6 7 8s0 3-2.2 4C7 13 7 14 7 16s0 3.5 2 3.5M15 4.5c2 0 2 1.5 2 3.5s0 3 2.2 4c-2.2 1-2.2 2-2.2 4s0 3.5-2 3.5"/>',
tools:'<circle cx="12" cy="12" r="3"/><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6 6l2.1 2.1M15.9 15.9L18 18M6 18l2.1-2.1M15.9 8.1L18 6"/>',
stop:'<circle cx="12" cy="12" r="8"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/>',
human:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-4 3-6.2 7-6.2s7 2.2 7 6.2"/>'};
// role: ops = cyan, ai = purple, risk = amber (brand rule)
const COL={ops:'#19b8d8',ai:'#9a7bff',risk:'#f2a516'};
const N={
 w:{x:130,y:470,app:'webhook',role:'ops',l:['Lead form','webhook'],show:3.8,tag:'TRIGGER'},
 v:{x:320,y:470,app:'tools',role:'ops',l:['Clean +','validate'],show:4.1},
 c:{x:510,y:470,app:'store',role:'ops',l:['Duplicate','check'],show:4.4},
 a:{x:700,y:470,app:'claude',role:'ai',l:['Claude','scores lead'],show:4.7},
 p:{x:890,y:470,app:'json',role:'ai',l:['Check the','answer'],show:5.0},
 h:{x:1080,y:470,app:'hubspot',role:'ops',l:['Save contact','(DEMO tag)'],show:5.3},
 rt:{x:1270,y:470,app:'router',role:'ops',l:['Router'],show:5.6},
 th:{x:1500,y:250,app:'hubspot',role:'ops',l:['Create task'],show:5.8},
 sl:{x:1740,y:250,app:'slack',role:'ops',l:['Slack','#leads alert'],show:5.9},
 sr:{x:1500,y:470,app:'human',role:'risk',l:['Human review'],show:6.0},
 lg:{x:1500,y:690,app:'store',role:'ops',l:['Log quietly'],show:6.0,dim:1},
 dup:{x:510,y:690,app:'stop',role:'risk',l:['Duplicate','stops here'],show:6.0,dim:1}
};
const E=[['w','v'],['v','c'],['c','a'],['a','p'],['p','h'],['h','rt'],['rt','th','Hot'],['th','sl'],['rt','sr','Review'],['rt','lg','Warm / cold'],['c','dup','duplicate']];
const ACT={w:[6.3,7.6],v:[10.5,11.7],c:[11.9,13.0],a:[13.0,14.8],p:[15.1,17.2],h:[17.2,18.3],rt:[18.3,19.6],th:[19.6,20.4],sl:[20.4,21.3],sr:[21.7,23.3]};
const BK=[[6.9,'w'],[10.0,'w'],[10.9,'v'],[11.7,'v'],[12.5,'c'],[12.9,'c'],[13.5,'a'],[14.8,'a'],[15.4,'p'],[17.0,'p'],[17.6,'h'],[18.0,'h'],[18.6,'rt'],[19.2,'rt'],[19.9,'th'],[20.2,'th'],[20.8,'sl'],[21.2,'sl']];
const BK2=[[21.55,'rt'],[21.7,'rt'],[22.6,'sr'],[23.4,'sr']];
const CHIPS=[[6.9,10.0,'w','new lead arrives'],[10.9,11.7,'v','cleaned and checked'],[12.5,12.95,'c','not a duplicate'],[13.9,14.9,'a','score 78 · confidence 0.86'],[15.4,17.0,'p','Make sets the tier: HOT'],[17.6,18.1,'h','saved to the CRM'],[19.9,20.3,'th','task created'],[20.8,21.3,'sl','alert sent']];
const CHIPS2=[[22.6,23.4,'sr','needs a person']];
const CAPS=[[0.3,3.3,"New leads shouldn't wait for someone to check the inbox."],[3.83,5.8,"Here's how one lead moves through the system."],[6.33,10.05,"A form fires the trigger, and Make wraps the lead in a bundle."],[10.58,14.5,"It cleans the data, checks for duplicates, and Claude scores the lead."],[15.01,18.75,"Make, not the AI, decides hot, warm, or cold."],[19.26,21.1,"Hot leads reach Slack instantly."],[21.54,23.45,"Anything uncertain goes to a person."],[23.97,25.4,"Every run is logged."]];
const NS='http://www.w3.org/2000/svg';
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const ez=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const mk=(tag,at,html)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(html)e.innerHTML=html;return e};
const eg=document.getElementById('edges'),lg=document.getElementById('labels'),ng=document.getElementById('nodes'),bg=document.getElementById('bundles');
const EP={},ENode={};
E.forEach(([f,t,l])=>{const a=N[f],b=N[t];const x1=a.x+58,x2=b.x-58;let d;
 if(a.y===b.y)d=`M ${x1} ${a.y} L ${x2} ${b.y}`;
 else if(a.x===b.x)d=`M ${a.x} ${a.y+58} L ${b.x} ${b.y-58}`;
 else{const mx=(x1+x2)/2;d=`M ${x1} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${x2} ${b.y}`}
 const p=mk('path',{d,fill:'none',stroke:'#3a4780','stroke-width':5,'stroke-linecap':'round','marker-end':'url(#arr)'});eg.appendChild(p);EP[f+'>'+t]=p;
 if(l){const q=p.getPointAtLength(p.getTotalLength()*(a.y===b.y?.5:.58));const w=l.length*14+34;
  const g=mk('g',{transform:`translate(${q.x},${q.y})`},`<rect x="${-w/2}" y="-20" width="${w}" height="40" rx="20" fill="#0f1733" stroke="#2f3b72" stroke-width="2"/><text text-anchor="middle" dominant-baseline="central" fill="#aab4e0" font-size="22" font-weight="600" font-family="IBM Plex Sans">${l}</text>`);
  lg.appendChild(g);EP[f+'>'+t+'#l']=g}});
const NE={};
for(const id in N){const n=N[id];const c=COL[n.role];
 const lines=n.l.map((s,i)=>`<text y="${92+i*30}" text-anchor="middle" fill="#eaf0ff" font-size="26" font-weight="600" font-family="IBM Plex Sans">${s}</text>`).join('');
 const tag=n.tag?`<text y="-82" text-anchor="middle" fill="#8b95bd" font-size="20" font-weight="700" letter-spacing="3" font-family="IBM Plex Sans">${n.tag}</text>`:'';
 const g=mk('g',{transform:`translate(${n.x},${n.y})`},`<circle class="ring" r="76" fill="none" stroke="${c}" stroke-width="5" opacity="0"/><circle r="52" fill="${c}" stroke="rgba(255,255,255,.35)" stroke-width="3"/><svg x="-30" y="-30" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${G[n.app]}</svg>${tag}${lines}<g class="ok" opacity="0" transform="translate(40,-40)"><circle r="17" fill="#0a0f1f" stroke="${c}" stroke-width="3"/><path d="M-7 0l5 5 9-11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>`);
 ng.appendChild(g);NE[id]=g}
function mkBundle(color){return mk('g',{opacity:0},`<rect x="-26" y="-18" width="52" height="36" rx="10" fill="${color}" stroke="#0a0f1f" stroke-width="4"/><text text-anchor="middle" dominant-baseline="central" fill="#0a0f1f" font-size="22" font-weight="700" font-family="IBM Plex Sans">{ }</text>`)}
const B1=mkBundle(COL.ops),B2=mkBundle(COL.risk);bg.appendChild(B1);bg.appendChild(B2);
function mkChip(){const g=mk('g',{opacity:0},'<rect rx="22" height="44" fill="#101a3c" stroke="#3a4780" stroke-width="2"></rect><text dominant-baseline="central" fill="#eaf0ff" font-size="24" font-weight="600" font-family="IBM Plex Sans"></text>');return g}
const C1=mkChip(),C2=mkChip();bg.appendChild(C1);bg.appendChild(C2);
function place(B,keys,t,C,chips,col){
 if(t<keys[0][0]||t>keys[keys.length-1][0]+.4){B.setAttribute('opacity',0);C.setAttribute('opacity',0);return}
 let pos=null;
 for(let i=0;i<keys.length-1;i++){const[a,na]=keys[i],[b,nb]=keys[i+1];
  if(t>=a&&t<=b){if(na===nb){pos={x:N[na].x,y:N[na].y}}else{const p=EP[na+'>'+nb];const L=p.getTotalLength();const q=p.getPointAtLength(ez(pr(t,a,b))*L);pos={x:q.x,y:q.y}}break}}
 if(!pos){const k=keys[keys.length-1];pos={x:N[k[1]].x,y:N[k[1]].y}}
 const last=keys[keys.length-1][0];const fo=1-pr(t,last,last+.4);const fi=pr(t,keys[0][0],keys[0][0]+.25);
 B.setAttribute('transform',`translate(${pos.x},${pos.y-84}) scale(${.6+.4*fi})`);B.setAttribute('opacity',fi*fo);
 let ch=chips.find(c=>t>=c[0]&&t<=c[1]);
 if(ch){const txt=ch[3];const w=txt.length*13.5+44;const g=C;g.querySelector('rect').setAttribute('width',w);g.querySelector('rect').setAttribute('x',-w/2);g.querySelector('rect').setAttribute('y',-22);const tx=g.querySelector('text');tx.textContent=txt;tx.setAttribute('x',-w/2+22);
  g.setAttribute('transform',`translate(${pos.x},${pos.y-140})`);g.setAttribute('opacity',Math.min(pr(t,ch[0],ch[0]+.2),1-pr(t,ch[1]-.15,ch[1]))*fo)}else C.setAttribute('opacity',0)}
function render(t){
 // title: big centre intro, then moves to the top-left
 const T=document.getElementById('title');const mv=ez(pr(t,3.0,3.9));
 T.style.left=(560-470*mv)+'px';T.style.top=(400-344*mv)+'px';T.style.transform=`scale(${1.5-.5*mv})`;T.style.transformOrigin='left top';
 T.style.opacity=pr(t,.1,.6);
 const endf=pr(t,25.6,26.3);
 document.getElementById('svg').style.opacity=1-.85*endf;
 // nodes
 for(const id in N){const n=N[id],g=NE[id];const s=pr(t,n.show,n.show+.45);const base=(n.dim?.38:1);
  g.setAttribute('opacity',s*base);g.setAttribute('transform',`translate(${n.x},${n.y}) scale(${.8+.2*ez(s)})`);
  const act=ACT[id];let on=0,done=0;if(act){on=(t>=act[0]&&t<=act[1])?1:0;done=t>act[1]?1:0}
  const ring=g.querySelector('.ring');ring.setAttribute('opacity',on*(.6+.4*Math.sin(t*9)));
  g.querySelector('.ok').setAttribute('opacity',done);
  g.querySelector('circle:nth-of-type(2)').setAttribute('filter',on?'url(#glow)':'')}
 for(const k in EP){if(k.endsWith('#l')){const [f,to]=k.slice(0,-2).split('>');EP[k].setAttribute('opacity',pr(t,N[to].show,N[to].show+.4)*(N[to].dim?.38:1));continue}
  const [f,to]=k.split('>');const s=pr(t,N[to].show,N[to].show+.4);const dim=N[to].dim?.38:1;EP[k].setAttribute('opacity',s*dim);
  EP[k].setAttribute('stroke','#3a4780')}
 // traveled edges glow
 BK.forEach((k,i)=>{if(i>0&&BK[i-1][1]!==k[1]&&t>BK[i-1][0]){const p=EP[BK[i-1][1]+'>'+k[1]];p.setAttribute('stroke',COL.ops);p.setAttribute('opacity',Math.max(+p.getAttribute('opacity'),.9))}});
 place(B1,BK,t,C1,CHIPS);place(B2,BK2,t,C2,CHIPS2);
 // captions
 const cap=document.getElementById('cap');const c=CAPS.find(x=>t>=x[0]&&t<=x[1]);
 if(c){cap.textContent=c[2];cap.style.opacity=Math.min(pr(t,c[0],c[0]+.2),1-pr(t,c[1]-.15,c[1]))}else cap.style.opacity=0;
 // run-log strip
 document.getElementById('log').style.opacity=Math.min(pr(t,24.0,24.5),1-pr(t,25.3,25.7));
 // end card
 const E1=document.getElementById('end');E1.style.opacity=pr(t,26.0,26.6);
 E1.querySelector('.a').style.opacity=pr(t,26.0,26.6);E1.querySelector('.b').style.opacity=pr(t,27.2,27.8);E1.querySelector('.c').style.opacity=pr(t,28.0,28.6);
 if(t>=25.6){T.style.opacity=pr(t,.1,.6)*(1-endf)}
}
window.render=render;render(0);
</script></body></html>
